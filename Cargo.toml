[package]
name = "ratus"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = "0.15.7"
poise = "0.7.0"
reqwest = { version = "0.12", features = ["json", "multipart"] }
serde_json = "1"
serenity = { version = "0.12", features = ["voice"] }
songbird = { version = "0.6.1", features = ["builtin-queue", "receive"] }
symphonia = { version = "0.5", features = ["aac", "mp3", "isomp4", "alac", "mkv", "wav", "pcm"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
